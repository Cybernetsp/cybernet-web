<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cybernet - Cargar Inventario</title>
    
    <link rel="icon" type="image/jpeg" href="logo.jpeg">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cybernet Cargar">
    
    <link rel="stylesheet" href="global.css">
    
    <style>
        /* Ajuste específico para que los inputs en cargar se vean bien en móviles y PC */
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <header class="global-header" id="globalHeader">
        <div class="flex-row" id="staffStatusBar">
            <div class="badge-ios badge-blue">
                <span id="staffSessionName">STAFF</span> • CARGAR INVENTARIO
            </div>
            <div class="badge-ios badge-green" id="timerBadgeContainer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="shiftTimer">00:00:00</span>
            </div>
        </div>

        <div class="flex-row">
            <button class="btn-ios btn-secondary" onclick="window.location.href='admin.html'">
                ← Volver al Panel
            </button>
        </div>
    </header>

    <main class="main-workspace" style="max-width: 1000px; width: 100%; padding-left: 20px; padding-right: 20px;">
        
        <div class="card-ios" style="width: 100%;">
            <div class="flex-row mb-1" style="justify-content: center;">
                <h2 class="card-title" style="color: var(--ios-green);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14"></path>
                    </svg>
                    Ingreso Masivo de Cuentas
                </h2>
            </div>
            
            <form id="formCargarCuentas" class="flex-col" onsubmit="ejecutarCargaLote(event)">
                
                <div class="grid-inputs">
                    <select id="loadPlataforma" class="input-ios" style="margin-bottom: 0;" required>
                        <option value="" disabled selected>Selecciona la Plataforma...</option>
                        <option value="AMAZON-PRIME-VIDEO">AMAZON PRIME VIDEO</option>
                        <option value="DISNEY-PREMIUM">DISNEY PREMIUM</option>
                        <option value="HBO-MAX">HBO MAX</option>
                        <option value="DISNEY-ESTANDAR">DISNEY ESTANDAR</option>
                        <option value="PLEX">PLEX</option>
                        <option value="CRUNCHYROLL">CRUNCHYROLL</option>
                        <option value="VIX">VIX</option>
                        <option value="PARAMOUNT">PARAMOUNT</option>
                        <option value="METEGOL">METEGOL</option>
                        <option value="CANVA">CANVA</option>
                        <option value="CAPCUT">CAPCUT</option>
                        <option value="SPOTIFY">SPOTIFY</option>
                        <option value="YOUTUBE">YOUTUBE</option>
                        <option value="DEEZER">DEEZER</option>
                    </select>

                    <select id="loadProveedor" class="input-ios" style="margin-bottom: 0;" onchange="comprobarProveedorDinamico()" required>
                        <option value="" disabled selected>Selecciona el Proveedor...</option>
                        <option value="ANA">ANA</option>
                        <option value="CHAYO">CHAYO</option>
                        <option value="FABIAN">FABIAN</option>
                        <option value="OTRO">Otro (Escribir manualmente)</option>
                    </select>
                </div>

                <div id="wrapperProveedorManual" style="display: none; width: 100%;">
                    <input type="text" id="loadProveedorManual" class="input-ios" placeholder="Escribe el nombre del nuevo proveedor">
                </div>

                <textarea id="loadCuentasBloque" class="input-ios" style="min-height: 180px; font-family: monospace;" placeholder="Copia y pega las cuentas aquí. Formatos aceptados:&#10;correo@gmail.com clave123&#10;correo@gmail.com:clave123&#10;correo2@gmail.com | clave456" required></textarea>
                
                <button type="submit" id="btnSubmitCarga" class="btn-ios btn-success w-100" style="padding: 14px; font-size: 1.05rem;">
                    Cargar Cuentas en Lote
                </button>
            </form>
        </div>

        <div class="card-ios" style="width: 100%;">
            <div class="flex-row-between mb-1">
                <h2 class="card-title" style="color: var(--ios-orange);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <polyline points="9 12 11 14 15 10"></polyline>
                    </svg>
                    Estatus de Garantías
                </h2>
                <button type="button" class="btn-ios btn-secondary" style="padding: 6px 12px; font-size: 0.8rem; color: var(--ios-orange); border-color: rgba(255, 159, 10, 0.3);" onclick="cargarResumenProveedores()">🔄 Actualizar</button>
            </div>
            
            <div style="width: 100%; overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="padding: 12px 10px; text-align: left; border-bottom: 0.5px solid rgba(255,255,255,0.1); font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase;">Proveedor</th>
                            <th style="padding: 12px 10px; text-align: center; border-bottom: 0.5px solid rgba(255,255,255,0.1); font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase;">Caídas Activas</th>
                            <th style="padding: 12px 10px; text-align: right; border-bottom: 0.5px solid rgba(255,255,255,0.1); font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase;">Estado de Salud</th>
                        </tr>
                    </thead>
                    <tbody id="tablaResumenProveedores">
                        <tr>
                            <td colspan="3" style="text-align: center; padding: 20px; color: var(--text-secondary);">⏳ Sincronizando métricas de calidad...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWdHzqlwlAWcCuXngcurIIrZVCHl5QEhRUkHTL90dhNqfm1iXnvSvDli5G_r6zlmHY/exec";
        let timerInterval = null;
        let isTimerPaused = false;

        function haptic() { 
            if (navigator.vibrate) navigator.vibrate(15); 
        }

        // ==========================================
        // VALIDACIÓN INTERNA DEL SELECTOR DE PROVEEDOR
        // ==========================================
        function comprobarProveedorDinamico() {
            const selectProv = document.getElementById('loadProveedor').value;
            const wrapperManual = document.getElementById('wrapperProveedorManual');
            const inputManual = document.getElementById('loadProveedorManual');

            if (selectProv === "OTRO") {
                wrapperManual.style.display = 'block';
                inputManual.required = true;
                inputManual.focus();
            } else {
                wrapperManual.style.display = 'none';
                inputManual.required = false;
                inputManual.value = "";
            }
        }

        // ==========================================
        // CONEXIÓN CON EL ENDPOINT DEL SCRIPT
        // ==========================================
        function ejecutarCargaLote(e) {
            e.preventDefault();
            haptic();

            const btnSubmit = document.getElementById('btnSubmitCarga');
            const plataforma = document.getElementById('loadPlataforma').value;
            const selectProv = document.getElementById('loadProveedor').value;
            const proveedorManual = document.getElementById('loadProveedorManual').value.trim();
            const bloqueCuentas = document.getElementById('loadCuentasBloque').value;

            // Filtro limpiador de plantillas sucias
            let textoProcesado = bloqueCuentas;
            
            if (/cuenta:/i.test(textoProcesado) && (/contraseña:/i.test(textoProcesado) || /password:/i.test(textoProcesado))) {
                let lineasRaw = textoProcesado.split('\n');
                let listaCuentasExtraidas = [];
                let usuarioTemporal = "";
                let claveTemporal = "";
                
                for (let i = 0; i < lineasRaw.length; i++) {
                    let lineaLimpia = lineasRaw[i].trim();
                    
                    if (/^cuenta:/i.test(lineaLimpia)) {
                        usuarioTemporal = lineaLimpia.substring(lineaLimpia.indexOf(':') + 1).trim();
                    } 
                    else if (/^(contraseña|contrase|password):/i.test(lineaLimpia)) {
                        claveTemporal = lineaLimpia.substring(lineaLimpia.indexOf(':') + 1).trim();
                        
                        if (usuarioTemporal !== "" && claveTemporal !== "") {
                            listaCuentasExtraidas.push(usuarioTemporal + " " + claveTemporal);
                            usuarioTemporal = "";
                            claveTemporal = "";
                        }
                    }
                }
                textoProcesado = listaCuentasExtraidas.join('\n');
            } else {
                let lineas = textoProcesado.split('\n');
                let lineasNormalizadas = lineas.map(linea => {
                    let l = linea.trim();
                    if (l.includes(':') && !l.includes('|') && !l.includes(' ')) {
                        return l.replace(':', ' ');
                    }
                    return l;
                });
                textoProcesado = lineasNormalizadas.join('\n');
            }

            const bloqueCuentasFinal = textoProcesado;
            const proveedorFinal = (selectProv === "OTRO") ? proveedorManual : selectProv;

            if (selectProv === "OTRO" && proveedorFinal === "") {
                alert("⚠️ Por favor escribe el nombre del nuevo proveedor.");
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "⏳ Procesando e Inyectando Lote...";

            const oldScript = document.getElementById('cyber_cargamasiva_node');
            if (oldScript) oldScript.remove();

            window.procesarCargaLoteSheets = function(res) {
                const scriptNode = document.getElementById('cyber_cargamasiva_node');
                if (scriptNode) scriptNode.remove();

                btnSubmit.disabled = false;
                btnSubmit.innerText = "Cargar Cuentas en Lote";

                if (res && res.status === "success") {
                    alert("🚀 " + res.message);
                    document.getElementById('formCargarCuentas').reset();
                    document.getElementById('wrapperProveedorManual').style.display = 'none';
                } else {
                    alert("❌ Error de Inserción: " + (res ? res.message : "Fallo de conexión externa."));
                }
            };

            const scriptElement = document.createElement('script');
            scriptElement.id = 'cyber_cargamasiva_node';
            let queryParams = `?action=cargarCuentasMasivo&plataforma=${encodeURIComponent(plataforma)}&proveedor=${encodeURIComponent(proveedorFinal)}&bloqueCuentas=${encodeURIComponent(bloqueCuentasFinal)}&callback=procesarCargaLoteSheets&_ts=${Date.now()}`;
            scriptElement.src = GOOGLE_SCRIPT_URL + queryParams;
            document.body.appendChild(scriptElement);
        }
        
        // ==========================================
        // ANÁLISIS DE CALIDAD DE PROVEEDORES
        // ==========================================
        function cargarResumenProveedores() {
            const tbody = document.getElementById('tablaResumenProveedores');
            if (!tbody) return;
            
            const oldScript = document.getElementById('cyber_prov_summary_node');
            if (oldScript) oldScript.remove();

            window.procesarResumenProveedores = function(res) {
                const scriptNode = document.getElementById('cyber_prov_summary_node');
                if (scriptNode) scriptNode.remove();

                if (res && res.status === "success") {
                    const data = res.data;
                    const conteo = { "ANA": 0, "CHAYO": 0, "FABIAN": 0, "OTROS / MANUAL": 0 };
                    
                    data.forEach(item => {
                        let prov = String(item.proveedor || "").toUpperCase().trim();
                        if (prov === "ANA" || prov === "CHAYO" || prov === "FABIAN") {
                            conteo[prov]++;
                        } else if (prov !== "") {
                            conteo["OTROS / MANUAL"]++;
                        }
                    });

                    let html = "";
                    for (let prov in conteo) {
                        let cant = conteo[prov];
                        let alarmaTexto = "🟢 Estable";
                        let alarmaColor = "var(--ios-green)";
                        
                        if (cant > 4) {
                            alarmaTexto = "🔴 Crítico";
                            alarmaColor = "var(--ios-red)";
                        } else if (cant > 0) {
                            alarmaTexto = "🟠 Riesgo";
                            alarmaColor = "var(--ios-orange)";
                        }

                        html += `
                        <tr>
                            <td style="padding: 12px 10px; border-bottom: 0.5px solid rgba(255,255,255,0.05);"><strong>${prov}</strong></td>
                            <td style="padding: 12px 10px; border-bottom: 0.5px solid rgba(255,255,255,0.05); text-align: center; font-family: monospace; font-weight: bold; font-size: 1.1rem; color: ${cant > 0 ? 'var(--ios-red)' : 'var(--text-secondary)'};">${cant}</td>
                            <td style="padding: 12px 10px; border-bottom: 0.5px solid rgba(255,255,255,0.05); text-align: right; font-weight: 600; color: ${alarmaColor};">${alarmaTexto}</td>
                        </tr>`;
                    }
                    tbody.innerHTML = html;
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: var(--ios-red);">❌ Error al sincronizar métricas.</td></tr>';
                }
                delete window.procesarResumenProveedores;
            };

            const scriptElement = document.createElement('script');
            scriptElement.id = 'cyber_prov_summary_node';
            scriptElement.src = GOOGLE_SCRIPT_URL + "?action=obtenerGarantias&callback=procesarResumenProveedores&_ts=" + Date.now();
            document.body.appendChild(scriptElement);
        }

        // ==========================================
        // CONTROL DEL TEMPORIZADOR DE TURNO
        // ==========================================
        function startShiftTimer() {
            if (!sessionStorage.getItem('cyber_shift_start_time')) {
                sessionStorage.setItem('cyber_shift_start_time', Date.now());
            }
            if (!sessionStorage.getItem('cyber_shift_accumulated_time')) {
                sessionStorage.setItem('cyber_shift_accumulated_time', 0);
            }

            if (timerInterval) {
                clearInterval(timerInterval);
            }

            timerInterval = setInterval(function() {
                if (isTimerPaused) return; 
                
                let startTime = parseInt(sessionStorage.getItem('cyber_shift_start_time'));
                let accumulated = parseInt(sessionStorage.getItem('cyber_shift_accumulated_time'));
                if (isNaN(accumulated)) accumulated = 0;
                
                let elapsed = Date.now() - startTime;
                let totalMs = accumulated + elapsed;
                
                let totalSeconds = Math.floor(totalMs / 1000);
                let hours = Math.floor(totalSeconds / 3600);
                let minutes = Math.floor((totalSeconds % 3600) / 60);
                let seconds = totalSeconds % 60;

                let hStr = String(hours).padStart(2, '0');
                let mStr = String(minutes).padStart(2, '0');
                let sStr = String(seconds).padStart(2, '0');

                let stElement = document.getElementById('shiftTimer');
                if (stElement) stElement.innerText = hStr + ":" + mStr + ":" + sStr;
            }, 1000);
        }

        // ==========================================
        // CARGA INICIAL DE LA INTERFAZ
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            const activeUser = sessionStorage.getItem('active_staff');
            cargarResumenProveedores(); 
            
            if(activeUser) {
                document.getElementById('staffSessionName').innerText = activeUser.toUpperCase();
                
                // 🛑 REGLA: Si el usuario es CAMILO, se bloquea el contador de horas
                if (activeUser.toUpperCase() !== "CAMILO") {
                    startShiftTimer(); 
                } else {
                    const timerBadge = document.getElementById('timerBadgeContainer');
                    if (timerBadge) {
                        timerBadge.style.display = 'none';
                    }
                }
            }

            // APLICA EL TEMA GUARDADO EN LOCALSTORAGE AUTOMÁTICAMENTE
            let savedTheme = localStorage.getItem('cyber_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        });
    </script>
</body>
</html>
