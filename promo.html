<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cybernet Staff - Promo</title>

    <link rel="icon" type="image/jpeg" href="logo.jpeg" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="stylesheet" href="global.css" />

    <style>
      /* Animación nativa de carga (Reemplazo del emoji ⏳) */
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
      .spin-anim {
        animation: spin 1s linear infinite;
      }

      /* Ajuste fino para el botón de la cabecera */
      .btn-header-back {
        width: auto;
        padding: 8px 16px;
        font-size: 0.85rem;
        border-radius: 12px;
        margin: 0;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div id="appleToast" class="apple-notification-toast"></div>

    <header class="global-header" id="globalHeader">
      <div class="flex-row" id="staffStatusBar">
        <div class="badge-ios badge-blue">
          <span id="staffSessionName">USER</span> • PROMO
        </div>
        <div class="badge-ios badge-green" id="timerBadgeContainer">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="shiftTimer">00:00:00</span>
        </div>
      </div>
      <button
        class="btn-ios btn-secondary btn-header-back"
        onclick="window.location.href = 'admin.html'"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          style="margin-right: 4px; vertical-align: bottom"
        >
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Volver
      </button>
    </header>

    <main class="main-workspace workspace-promo">
      <div class="card-ios">
        <div
          class="flex-row-between mb-1"
          style="
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
          "
        >
          <h2 class="card-title" style="margin: 0">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="var(--ios-blue)"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon
                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
              ></polygon>
            </svg>
            Motor de Promociones
          </h2>
          <div class="badge-ios badge-blue" id="badgeTotalClients">
            0 clientes
          </div>
        </div>

        <button
          id="btnFetchContacts"
          class="btn-ios btn-primary w-100 mt-1"
          style="padding: 16px; font-size: 1.05rem"
          onclick="iniciarSincronizacion()"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="margin-right: 6px; vertical-align: middle"
          >
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
            ></path>
          </svg>
          Generar Promo
        </button>

        <div
          id="blockButtonsContainer"
          class="blocks-container"
          style="margin-top: 15px"
        ></div>
      </div>

      <div class="card-ios">
        <div
          class="card-title mb-1"
          style="
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
            margin-bottom: 20px;
          "
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--ios-green)"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          Directorio Generado
        </div>

        <div id="promoGridContainer" class="contacts-grid">
          <div
            class="status-empty"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 12px;
              color: var(--text-secondary);
            "
          >
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
            <span
              >Presiona "Generar Promo" para extraer los clientes de la base de
              datos.</span
            >
          </div>
        </div>
      </div>
    </main>

    <script>
      const GOOGLE_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbzWdHzqlwlAWcCuXngcurIIrZVCHl5QEhRUkHTL90dhNqfm1iXnvSvDli5G_r6zlmHY/exec";

      let isFetching = false;
      let globalContacts = [];
      let currentBlockIndex = 0;
      const CHUNK_SIZE = 10;

      let timerInterval = null;
      let temporizadorInactividad = null;
      const INACTIVITY_LOGOUT_LIMIT = 30 * 60 * 1000;
      let isTimerPaused = false;

      function hapticFeedback() {
        if (navigator.vibrate) navigator.vibrate(15);
      }

      // Sistema de Toast Nativo Apple (Con soporte para SVGs inyectados)
      function triggerToast(msgHTML) {
        const toast = document.getElementById("appleToast");
        toast.innerHTML = msgHTML;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      }

      function iniciarSincronizacion() {
        if (isFetching) return;

        hapticFeedback();
        isFetching = true;
        globalContacts = [];
        currentBlockIndex = 0;

        const btn = document.getElementById("btnFetchContacts");
        const badge = document.getElementById("badgeTotalClients");
        const blockContainer = document.getElementById("blockButtonsContainer");
        const gridContainer = document.getElementById("promoGridContainer");

        btn.disabled = true;

        // SVG Animado (Reemplazo del reloj de arena)
        btn.innerHTML = `<svg class="spin-anim" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; vertical-align: middle;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg> Generando Promo...`;

        blockContainer.innerHTML = "";

        // SVG Animado de carga central
        gridContainer.innerHTML = `
            <div class="status-empty" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--ios-blue);">
                <svg class="spin-anim" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                <span style="font-weight: 600;">Extrayendo clientes y aplicando motor 60/40...</span>
            </div>`;

        badge.innerText = "0 clientes";

        const oldScript = document.getElementById("cyber_promo_node");
        if (oldScript) oldScript.remove();

        window.procesarSincronizacion = function (res) {
          isFetching = false;
          btn.disabled = false;
          btn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: middle;">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                    Generar Promo
                `;

          const scriptNode = document.getElementById("cyber_promo_node");
          if (scriptNode) scriptNode.remove();

          if (res && res.status === "success") {
            let data = res.data;

            if (!data || data.length === 0) {
              gridContainer.innerHTML = `
                <div class="status-empty" style="display:flex; align-items:center; justify-content:center; gap:8px; color:var(--ios-orange); font-weight: 600;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    No quedan clientes disponibles en el Histórico.
                </div>`;
              return;
            }

            let uniqueMap = new Map();
            for (let i = 0; i < data.length; i++) {
              let item = data[i];
              let tel = item.tel;
              if (tel && tel.trim() !== "" && !uniqueMap.has(tel.trim())) {
                uniqueMap.set(tel.trim(), item);
              }
            }

            globalContacts = Array.from(uniqueMap.values()).slice(0, 20);

            if (globalContacts.length === 0) {
              gridContainer.innerHTML = `
                <div class="status-empty" style="display:flex; align-items:center; justify-content:center; gap:8px; color:var(--ios-red); font-weight: 600;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                    Registros inválidos en la base de datos.
                </div>`;
              return;
            }

            badge.innerText = `${globalContacts.length} clientes`;

            // Toast de éxito con SVG
            triggerToast(`
                <div style="display:flex; align-items:center; gap:8px; color:var(--ios-green);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    <span>Se prepararon ${globalContacts.length} contactos listos.</span>
                </div>
            `);

            crearBotonesBloques();
          } else {
            let errMsg =
              res && res.message ? res.message : "Error de conexión.";
            gridContainer.innerHTML = `
                <div class="status-empty" style="display:flex; align-items:center; justify-content:center; gap:8px; color:var(--ios-red); font-weight: 600;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                    ${errMsg}
                </div>`;
          }
        };

        const scriptElement = document.createElement("script");
        scriptElement.id = "cyber_promo_node";
        let queryParams =
          "?action=generarPromosWeb&callback=procesarSincronizacion&_ts=" +
          Date.now();
        scriptElement.src = GOOGLE_SCRIPT_URL + queryParams;
        document.body.appendChild(scriptElement);
      }

      function crearBotonesBloques() {
        const blockContainer = document.getElementById("blockButtonsContainer");
        blockContainer.innerHTML = "";

        const totalBlocks = Math.ceil(globalContacts.length / CHUNK_SIZE);

        for (let i = 0; i < totalBlocks; i++) {
          let start = i * CHUNK_SIZE + 1;
          let end = Math.min((i + 1) * CHUNK_SIZE, globalContacts.length);

          const btn = document.createElement("button");
          btn.className = `btn-block ${i === 0 ? "active" : ""}`;
          btn.id = `btnBlock_${i}`;
          btn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    Bloque (${start}-${end})
                `;

          btn.onclick = () => mostrarBloque(i);
          blockContainer.appendChild(btn);
        }

        mostrarBloque(0);
      }

      function mostrarBloque(blockIndex) {
        hapticFeedback();
        currentBlockIndex = blockIndex;

        const allBtns = document.querySelectorAll(".btn-block");
        allBtns.forEach((b) => b.classList.remove("active"));
        const activeBtn = document.getElementById(`btnBlock_${blockIndex}`);
        if (activeBtn) activeBtn.classList.add("active");

        const startIndex = blockIndex * CHUNK_SIZE;
        const endIndex = startIndex + CHUNK_SIZE;
        const loteActual = globalContacts.slice(startIndex, endIndex);

        const gridContainer = document.getElementById("promoGridContainer");
        gridContainer.innerHTML = "";

        loteActual.forEach((item, localIndex) => {
          const absoluteIndex = startIndex + localIndex;
          const visualIndex = absoluteIndex + 1;

          const safeMessage = item.mensaje
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");

          const card = document.createElement("div");
          card.className = "contact-card";
          card.innerHTML = `
                    <div class="contact-left">
                        <div class="index-badge">${visualIndex}</div>
                        <div class="phone-text" id="phone_text_${absoluteIndex}">${item.tel}</div>
                    </div>
                    <div class="contact-right">
                        <button class="btn-icon" title="Copiar Mensaje de Promo" onclick="copiarAlPortapapeles('${safeMessage}', this, ${absoluteIndex})">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                `;
          gridContainer.appendChild(card);
        });
      }

      function copiarAlPortapapeles(texto, btnElement, indexToCross) {
        hapticFeedback();
        navigator.clipboard
          .writeText(texto)
          .then(() => {
            efectoBotonExito(btnElement);
            marcarNumeroComoEnviado(indexToCross);
          })
          .catch(() => {
            const textarea = document.createElement("textarea");
            textarea.value = texto;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            window.getSelection().removeAllRanges();
            textarea.remove();

            efectoBotonExito(btnElement);
            marcarNumeroComoEnviado(indexToCross);
          });
      }

      function marcarNumeroComoEnviado(index) {
        const phoneEl = document.getElementById("phone_text_" + index);
        if (phoneEl) {
          phoneEl.classList.add("crossed-out");
        }
      }

      function efectoBotonExito(btn) {
        const originalHTML = btn.innerHTML;
        btn.classList.add("success");
        // Reemplaza el ícono de copiar por un "Check" SVG
        btn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            `;

        setTimeout(() => {
          btn.classList.remove("success");
          btn.innerHTML = originalHTML;
        }, 1500);
      }

      // Funciones de Turno e Inactividad
      function startShiftTimer() {
        if (!sessionStorage.getItem("cyber_shift_start_time")) {
          sessionStorage.setItem("cyber_shift_start_time", Date.now());
        }
        if (!sessionStorage.getItem("cyber_shift_accumulated_time")) {
          sessionStorage.setItem("cyber_shift_accumulated_time", 0);
        }
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(function () {
          if (isTimerPaused) return;

          let startTime = parseInt(
            sessionStorage.getItem("cyber_shift_start_time"),
          );
          let accumulated = parseInt(
            sessionStorage.getItem("cyber_shift_accumulated_time"),
          );
          if (isNaN(accumulated)) accumulated = 0;

          let elapsed = Date.now() - startTime;
          let totalMs = accumulated + elapsed;

          let totalSeconds = Math.floor(totalMs / 1000);
          let hours = Math.floor(totalSeconds / 3600);
          let minutes = Math.floor((totalSeconds % 3600) / 60);
          let seconds = totalSeconds % 60;

          let hStr = String(hours).padStart(2, "0");
          let mStr = String(minutes).padStart(2, "0");
          let sStr = String(seconds).padStart(2, "0");

          let stElement = document.getElementById("shiftTimer");
          if (stElement) stElement.innerText = hStr + ":" + mStr + ":" + sStr;
        }, 1000);
      }

      function resetearInactividad() {
        if (!sessionStorage.getItem("active_staff")) return;
        if (temporizadorInactividad) clearTimeout(temporizadorInactividad);
        temporizadorInactividad = setTimeout(() => {
          if (sessionStorage.getItem("active_staff")) {
            alert(
              "⏳ Tu sesión se ha cerrado automáticamente tras 30 minutos de inactividad.",
            );
            window.location.href = "admin.html";
          }
        }, INACTIVITY_LOGOUT_LIMIT);
      }

      function iniciarControlInactividad() {
        window.addEventListener("mousemove", resetearInactividad);
        window.addEventListener("keypress", resetearInactividad);
        window.addEventListener("click", resetearInactividad);
        window.addEventListener("scroll", resetearInactividad);
        window.addEventListener("touchstart", resetearInactividad);
        resetearInactividad();
      }

      window.addEventListener("DOMContentLoaded", () => {
        let savedTheme = localStorage.getItem("cyber_theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);

        let activeUser = sessionStorage.getItem("active_staff") || "STAFF";
        document.getElementById("staffSessionName").innerText =
          activeUser.toUpperCase();

        // Si es Camilo, no muestra el contador
        if (activeUser.toUpperCase() !== "CAMILO") {
          startShiftTimer();
          iniciarControlInactividad();
        } else {
          const timerBadge = document.getElementById("timerBadgeContainer");
          if (timerBadge) {
            timerBadge.style.display = "none";
          }
        }
      });
    </script>
  </body>
</html>
