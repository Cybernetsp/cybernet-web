<!-- CAJA 3: PAGO DEL CLIENTE -->
            <div
              class="card-ios"
              style="
                padding: 16px 20px;
                margin: 0;
                border: 1px solid rgba(255, 159, 10, 0.2);
                background: rgba(255, 159, 10, 0.03);
              "
            >
              <span
                style="
                  font-size: 0.75rem;
                  font-weight: 800;
                  color: var(--ios-orange);
                  text-transform: uppercase;
                  letter-spacing: 0.5px;
                  margin-bottom: 10px;
                  display: flex;
                  align-items: center;
                  gap: 8px;
                "
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <path
                    d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
                  ></path>
                </svg>
                Pago del Cliente
              </span>

              <div style="display: flex; gap: 10px; width: 100%">
                <div
                  style="
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    gap: 4px;
                  "
                >
                  <label
                    style="
                      font-size: 0.7rem;
                      color: var(--text-secondary);
                      font-weight: 600;
                    "
                    >Monto cobrado *</label
                  >
                  <input
                    type="text"
                    id="ventaCantidad"
                    class="input-ios"
                    placeholder="$0"
                    oninput="formatearMontoEnVivoCOP(this)"
                    required
                    style="
                      margin: 0;
                      font-weight: 800;
                      color: var(--ios-orange);
                      font-size: 1.05rem;
                      background: rgba(0, 0, 0, 0.3) !important;
                      padding: 8px 12px !important;
                      height: 38px !important;
                    "
                  />
                </div>
                <div
                  style="
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    gap: 4px;
                  "
                >
                  <label
                    style="
                      font-size: 0.7rem;
                      color: var(--text-secondary);
                      font-weight: 600;
                    "
                    >Medio de pago *</label
                  >
                  <select
                    id="ventaBanco"
                    class="input-ios"
                    onchange="ajustarInterfazPorMetodoPagoV2()"
                    required
                    style="
                      margin: 0;
                      font-weight: 600;
                      font-size: 0.85rem;
                      background: rgba(0, 0, 0, 0.3) !important;
                      padding: 8px 12px !important;
                      height: 38px !important;
                    "
                  >
                    <option value="" disabled selected>
                      Selecciona banco...
                    </option>
                    <option value="Nequi">Nequi</option>
                    <option value="Bre-B">Bre-B</option>
                    <option value="Daviplata">Daviplata</option>
                    <option value="Bancolombia">Bancolombia</option>
                    <option value="Saldo Distribuidor">
                      Saldo Distribuidor
                    </option>
                    <option id="optPagoNomina" value="NÓMINA">
                      Descontar de Nómina
                    </option>
                  </select>
                </div>
              </div>
            </div>
