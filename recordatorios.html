<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cybernet Staff - Recordatorios de Pago</title>

    <link rel="icon" type="image/jpeg" href="logo.jpeg" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Recordatorios" />

    <link rel="stylesheet" href="global.css" />

    <style>
      /* Animación nativa de carga */
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
      .spin-anim {
        animation: spin 1s linear infinite;
      }

      /* Ajuste fino para el botón de la cabecera */
      .btn-header-back {
        width: auto;
        padding: 8px 16px;
        font-size: 0.85rem;
        border-radius: 12px;
        margin: 0;
        box-shadow: none;
      }

      /* Estados vacíos premium */
      .empty-state-premium {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 10px;
        color: var(--text-secondary);
        gap: 12px;
        grid-column: span 2;
        font-size: 0.9rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div id="appleToast" class="apple-notification-toast"></div>

    <header class="global-header" id="globalHeader">
      <div class="flex-row" id="staffStatusBar">
        <div
          class="badge-ios badge-blue"
          style="
            color: var(--ios-purple);
            border-color: rgba(191, 90, 242, 0.3);
            background: rgba(191, 90, 242, 0.1);
          "
        >
          <span id="staffSessionName">STAFF</span> • MULTI-WHATSAPP
        </div>
        <div class="badge-ios badge-green" id="timerBadgeContainer">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="shiftTimer">00:00:00</span>
        </div>
      </div>

      <div class="flex-row">
        <button
          class="btn-ios btn-secondary btn-header-back"
          onclick="window.location.href = 'admin.html'"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="margin-right: 4px; vertical-align: bottom"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Volver
        </button>
      </div>
    </header>

    <div class="recordatorios-container">
      <div class="workspace-column">
        <div class="card-ios">
          <div
            class="flex-row-between"
            style="
              border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
              padding-bottom: 12px;
              margin-bottom: 15px;
            "
          >
            <h2 class="card-title" style="margin-bottom: 0">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--ios-purple)"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                ></path>
              </svg>
              WhatsApp 1
            </h2>
            <span id="contadorW1" class="badge-ios badge-blue">0 clientes</span>
          </div>

          <select id="periodoW1" class="input-ios" style="margin-bottom: 12px">
            <option value="hoy" selected>Vencen: Hoy</option>
            <option value="ayer">Vencieron: Ayer</option>
            <option value="antes_ayer">Vencieron: Antes de Ayer</option>
            <option value="tres_dias">Por Vencer: En 3 Días</option>
          </select>

          <button class="btn-ios btn-primary w-100" onclick="sincronizarW1()">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="margin-right: 6px; vertical-align: bottom"
            >
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Sincronizar Panel 1
          </button>

          <div class="blocks-area-container mt-1" id="bloquesW1">
            <div
              style="
                text-align: center;
                padding: 15px;
                color: var(--text-secondary);
                font-size: 0.85rem;
                border: 1px dashed rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                grid-column: span 2;
              "
            >
              Sincroniza para ver los bloques de enlaces.
            </div>
          </div>
        </div>

        <div class="card-ios" style="flex-grow: 1">
          <h2
            class="card-title"
            style="
              border-bottom: 1px solid rgba(255, 255, 255, 0.08);
              padding-bottom: 12px;
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="margin-right: 4px"
            >
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            Lista de Mensajes (W1)
          </h2>
          <div class="reminders-scroll-area" id="listaIndividualW1">
            <div class="empty-state-premium">
              <svg
                class="spin-anim"
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="2" x2="12" y2="6"></line>
                <line x1="12" y1="18" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                <line x1="2" y1="12" x2="6" y2="12"></line>
                <line x1="18" y1="12" x2="22" y2="12"></line>
                <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
              </svg>
              <span>En espera de sincronización...</span>
            </div>
          </div>
        </div>
      </div>

      <div class="workspace-column">
        <div class="card-ios">
          <div
            class="flex-row-between"
            style="
              border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
              padding-bottom: 12px;
              margin-bottom: 15px;
            "
          >
            <h2 class="card-title" style="margin-bottom: 0">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="var(--ios-green)"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                ></path>
              </svg>
              WhatsApp 2
            </h2>
            <span id="contadorW2" class="badge-ios badge-green"
              >0 clientes</span
            >
          </div>

          <select id="periodoW2" class="input-ios" style="margin-bottom: 12px">
            <option value="tres_dias" selected>Por Vencer: En 3 Días</option>
            <option value="hoy">Vencen: Hoy</option>
            <option value="ayer">Vencieron: Ayer</option>
            <option value="antes_ayer">Vencieron: Antes de Ayer</option>
          </select>

          <button class="btn-ios btn-success w-100" onclick="sincronizarW2()">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="margin-right: 6px; vertical-align: bottom"
            >
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Sincronizar Panel 2
          </button>

          <div class="blocks-area-container mt-1" id="bloquesW2">
            <div
              style="
                text-align: center;
                padding: 15px;
                color: var(--text-secondary);
                font-size: 0.85rem;
                border: 1px dashed rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                grid-column: span 2;
              "
            >
              Sincroniza para ver los bloques de enlaces.
            </div>
          </div>
        </div>

        <div class="card-ios" style="flex-grow: 1">
          <h2
            class="card-title"
            style="
              border-bottom: 1px solid rgba(255, 255, 255, 0.08);
              padding-bottom: 12px;
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="margin-right: 4px"
            >
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            Lista de Mensajes (W2)
          </h2>
          <div class="reminders-scroll-area" id="listaIndividualW2">
            <div class="empty-state-premium">
              <svg
                class="spin-anim"
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="2" x2="12" y2="6"></line>
                <line x1="12" y1="18" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                <line x1="2" y1="12" x2="6" y2="12"></line>
                <line x1="18" y1="12" x2="22" y2="12"></line>
                <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
              </svg>
              <span>En espera de sincronización...</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const RECORDATORIOS_API_URL =
        "https://script.google.com/macros/s/AKfycbzWdHzqlwlAWcCuXngcurIIrZVCHl5QEhRUkHTL90dhNqfm1iXnvSvDli5G_r6zlmHY/exec";

      let timerInterval = null;
      let isTimerPaused = false;

      window.estadoW1 = { data: [], tachados: new Set(), periodo: "hoy" };
      window.estadoW2 = { data: [], tachados: new Set(), periodo: "tres_dias" };

      function haptic() {
        if (navigator.vibrate) navigator.vibrate(15);
      }

      // Sistema de Toast Nativo Apple (Con soporte para SVGs inyectados)
      function triggerToast(msgHTML) {
        const toast = document.getElementById("appleToast");
        toast.innerHTML = msgHTML;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      }

      function guardarEstadoEnLocal(refName) {
        let estado = refName === "W1" ? window.estadoW1 : window.estadoW2;
        let objetoParaGuardar = {
          data: estado.data,
          tachados: Array.from(estado.tachados),
          periodo: document.getElementById("periodo" + refName).value,
        };
        localStorage.setItem(
          "cyber_reminders_" + refName,
          JSON.stringify(objetoParaGuardar),
        );
      }

      function cargarEstadoDeLocal() {
        ["W1", "W2"].forEach((refName) => {
          let guardado = localStorage.getItem("cyber_reminders_" + refName);
          if (guardado) {
            let parsed = JSON.parse(guardado);
            let estado = refName === "W1" ? window.estadoW1 : window.estadoW2;

            estado.data = parsed.data || [];
            estado.tachados = new Set(parsed.tachados || []);
            estado.periodo =
              parsed.periodo || (refName === "W1" ? "hoy" : "tres_dias");

            document.getElementById("periodo" + refName).value = estado.periodo;

            if (estado.data.length > 0) {
              document.getElementById("contador" + refName).innerText =
                `${estado.data.length} clientes`;
              renderizarBloques(estado.data, "bloques" + refName);
              renderizarLista(estado, "listaIndividual" + refName, refName);
            }
          }
        });
      }

      function sincronizarW1() {
        haptic();
        const containerLista = document.getElementById("listaIndividualW1");
        const containerBloques = document.getElementById("bloquesW1");
        const periodo = document.getElementById("periodoW1").value;

        containerLista.innerHTML = `
            <div class="empty-state-premium">
                <svg class="spin-anim" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                <span>Escaneando NETFLIX en Sheets...</span>
            </div>`;

        containerBloques.innerHTML =
          '<div style="text-align:center; padding:15px; color:var(--text-secondary); font-size:0.85rem; grid-column: span 2;">Procesando...</div>';

        const oldScript = document.getElementById("cyber_reminders_w1");
        if (oldScript) oldScript.remove();

        window.procesarRespuestaW1 = function (res) {
          const scriptNode = document.getElementById("cyber_reminders_w1");
          if (scriptNode) scriptNode.remove();

          if (res && res.status === "success") {
            window.estadoW1.data = res.data;
            window.estadoW1.tachados = new Set();
            window.estadoW1.periodo = periodo;

            guardarEstadoEnLocal("W1");
            document.getElementById("contadorW1").innerText =
              `${res.data.length} clientes`;

            if (res.data.length === 0) {
              containerLista.innerHTML = `
                <div class="empty-state-premium" style="color:var(--ios-green);">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    <span>Todo limpio en este periodo para W1.</span>
                </div>`;
              containerBloques.innerHTML = "";
              return;
            }

            renderizarBloques(window.estadoW1.data, "bloquesW1");
            renderizarLista(window.estadoW1, "listaIndividualW1", "W1");
          } else {
            containerLista.innerHTML = `
                <div class="empty-state-premium" style="color:var(--ios-red);">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                    <span>Error: ${res ? res.message : "Fallo de conexión"}</span>
                </div>`;
          }
        };

        const scriptElement = document.createElement("script");
        scriptElement.id = "cyber_reminders_w1";
        scriptElement.src = `${RECORDATORIOS_API_URL}?action=obtenerRecordatorios&periodo=${encodeURIComponent(periodo)}&callback=procesarRespuestaW1&_ts=${Date.now()}`;
        document.body.appendChild(scriptElement);
      }

      function sincronizarW2() {
        haptic();
        const containerLista = document.getElementById("listaIndividualW2");
        const containerBloques = document.getElementById("bloquesW2");
        const periodo = document.getElementById("periodoW2").value;

        containerLista.innerHTML = `
            <div class="empty-state-premium">
                <svg class="spin-anim" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                <span>Escaneando NETFLIX en Sheets...</span>
            </div>`;
        containerBloques.innerHTML =
          '<div style="text-align:center; padding:15px; color:var(--text-secondary); font-size:0.85rem; grid-column: span 2;">Procesando...</div>';

        const oldScript = document.getElementById("cyber_reminders_w2");
        if (oldScript) oldScript.remove();

        window.procesarRespuestaW2 = function (res) {
          const scriptNode = document.getElementById("cyber_reminders_w2");
          if (scriptNode) scriptNode.remove();

          if (res && res.status === "success") {
            window.estadoW2.data = res.data;
            window.estadoW2.tachados = new Set();
            window.estadoW2.periodo = periodo;

            guardarEstadoEnLocal("W2");
            document.getElementById("contadorW2").innerText =
              `${res.data.length} clientes`;

            if (res.data.length === 0) {
              containerLista.innerHTML = `
                <div class="empty-state-premium" style="color:var(--ios-green);">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    <span>Todo limpio en este periodo para W2.</span>
                </div>`;
              containerBloques.innerHTML = "";
              return;
            }

            renderizarBloques(window.estadoW2.data, "bloquesW2");
            renderizarLista(window.estadoW2, "listaIndividualW2", "W2");
          } else {
            containerLista.innerHTML = `
                <div class="empty-state-premium" style="color:var(--ios-red);">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                    <span>Error: ${res ? res.message : "Desconocido"}</span>
                </div>`;
          }
        };

        const scriptElement = document.createElement("script");
        scriptElement.id = "cyber_reminders_w2";
        scriptElement.src = `${RECORDATORIOS_API_URL}?action=obtenerRecordatorios&periodo=${encodeURIComponent(periodo)}&callback=procesarRespuestaW2&_ts=${Date.now()}`;
        document.body.appendChild(scriptElement);
      }

      function renderizarBloques(dataArray, contenedorId) {
        const container = document.getElementById(contenedorId);
        container.innerHTML = "";

        let total = dataArray.length;
        let tamanoBloque = 20;
        let totalBloques = Math.ceil(total / tamanoBloque);

        for (let b = 0; b < totalBloques; b++) {
          let inicio = b * tamanoBloque + 1;
          let fin = Math.min((b + 1) * tamanoBloque, total);

          let btn = document.createElement("button");
          btn.className = "btn-ios btn-secondary mt-1";
          btn.style.fontSize = "0.85rem";
          btn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Bloque (${inicio}-${fin})
          `;

          btn.onclick = function () {
            haptic();
            let bloqueTexto = "";
            for (let i = b * tamanoBloque; i < fin; i++) {
              bloqueTexto += `${i + 1}. wa.me/${dataArray[i].tel}\n`;
            }

            navigator.clipboard.writeText(bloqueTexto.trim()).then(() => {
              let originalHTML = btn.innerHTML;
              btn.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                ¡Copiado!
              `;
              btn.style.background = "var(--ios-green)";
              btn.style.color = "white";
              btn.style.borderColor = "var(--ios-green)";

              triggerToast(`
                <div style="display:flex; align-items:center; gap:8px; color:var(--ios-green);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    <span>Bloque de contactos copiado</span>
                </div>
              `);

              setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.style.background = "";
                btn.style.color = "";
                btn.style.borderColor = "";
              }, 1200);
            });
          };
          container.appendChild(btn);
        }
      }

      function renderizarLista(estadoObj, contenedorId, refName) {
        const container = document.getElementById(contenedorId);
        let html = "";

        estadoObj.data.forEach((item, index) => {
          let msgEscaped = encodeURIComponent(item.mensaje);
          let rowId = `row-${refName}-${index}`;
          let claseTachado = estadoObj.tachados.has(index) ? "tachado" : "";

          html += `
                <div class="reminder-row-box ${claseTachado}" id="${rowId}">
                    <div class="reminder-left-info">
                        <div class="reminder-number">${index + 1}</div>
                        <div class="reminder-link-text">${item.tel}</div>
                    </div>
                    <button class="btn-ios btn-secondary" style="padding:8px 12px; color:var(--ios-blue);" onclick="copiarMsg(this, '${msgEscaped}', '${rowId}', '${refName}', ${index})">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>`;
        });
        container.innerHTML = html;
      }

      function copiarMsg(btn, msgEncoded, rowId, refName, indexObj) {
        haptic();
        const mensajeFinal = decodeURIComponent(msgEncoded);

        navigator.clipboard
          .writeText(mensajeFinal)
          .then(() => {
            marcarTachadoUniversal(btn, rowId, refName, indexObj);
          })
          .catch(() => {
            const textarea = document.createElement("textarea");
            textarea.value = mensajeFinal;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            textarea.remove();
            marcarTachadoUniversal(btn, rowId, refName, indexObj);
          });
      }

      function marcarTachadoUniversal(btn, rowId, refName, indexObj) {
        if (refName === "W1") {
          window.estadoW1.tachados.add(indexObj);
          guardarEstadoEnLocal("W1");
        }
        if (refName === "W2") {
          window.estadoW2.tachados.add(indexObj);
          guardarEstadoEnLocal("W2");
        }

        const row = document.getElementById(rowId);
        if (row) row.classList.add("tachado");

        const originalHTML = btn.innerHTML;
        btn.style.background = "var(--ios-green)";
        btn.style.color = "white";
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

        setTimeout(() => {
          btn.style.background = "";
          btn.style.color = "";
          btn.innerHTML = originalHTML;
        }, 1500);
      }

      // Funciones de Turno e Inactividad
      function startShiftTimer() {
        if (!sessionStorage.getItem("cyber_shift_start_time"))
          sessionStorage.setItem("cyber_shift_start_time", Date.now());
        if (!sessionStorage.getItem("cyber_shift_accumulated_time"))
          sessionStorage.setItem("cyber_shift_accumulated_time", 0);
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(function () {
          if (isTimerPaused) return;

          let startTime = parseInt(
            sessionStorage.getItem("cyber_shift_start_time"),
          );
          let accumulated = parseInt(
            sessionStorage.getItem("cyber_shift_accumulated_time"),
          );
          if (isNaN(accumulated)) accumulated = 0;

          let elapsed = Date.now() - startTime;
          let totalMs = accumulated + elapsed;

          let totalSeconds = Math.floor(totalMs / 1000);
          let hours = Math.floor(totalSeconds / 3600);
          let minutes = Math.floor((totalSeconds % 3600) / 60);
          let seconds = totalSeconds % 60;

          let hStr = String(hours).padStart(2, "0");
          let mStr = String(minutes).padStart(2, "0");
          let sStr = String(seconds).padStart(2, "0");

          let stElement = document.getElementById("shiftTimer");
          if (stElement) stElement.innerText = hStr + ":" + mStr + ":" + sStr;
        }, 1000);
      }

      window.addEventListener("DOMContentLoaded", () => {
        const activeUser = sessionStorage.getItem("active_staff");
        if (activeUser) {
          document.getElementById("staffSessionName").innerText =
            activeUser.toUpperCase();
          if (activeUser.toUpperCase() !== "CAMILO") {
            startShiftTimer();
          } else {
            const timerBadge = document.getElementById("timerBadgeContainer");
            if (timerBadge) timerBadge.style.display = "none";
          }
        }

        let savedTheme = localStorage.getItem("cyber_theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);

        cargarEstadoDeLocal();
      });
    </script>
  </body>
</html>
