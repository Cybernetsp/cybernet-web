<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cybernet - Acceso</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="icon" type="image/jpeg" href="logo.jpeg" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #09090b; /* Fondo negro profundo OLED */
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      /* Tarjeta del Login Estilo V2 */
      .login-card-v2 {
        background: #111115; /* Fondo popover oscuro premium */
        border: 1px solid #27272a; /* Borde gris fino característico */
        border-radius: 24px;
        padding: 40px 32px;
        width: 100%;
        max-width: 360px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      .login-title {
        color: #ffffff;
        font-size: 1.75rem;
        font-weight: 800;
        margin: 0 0 6px 0;
        letter-spacing: -0.5px;
      }

      .login-subtitle {
        color: #71717a; /* Texto secundario apagado */
        font-size: 0.85rem;
        font-weight: 500;
        margin: 0 0 28px 0;
      }

      /* Inputs Refinados */
      .input-group-v2 {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 16px;
      }

      .input-v2 {
        background: #18181b; /* Fondo input gris oscuro */
        border: 1px solid #27272a;
        border-radius: 12px;
        padding: 14px 16px;
        color: #ffffff;
        font-size: 0.9rem;
        outline: none;
        transition: all 0.2s ease;
      }

      .input-v2:focus {
        border-color: #0a84ff; /* Foco Azul iOS */
        box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15);
      }

      /* Casillero Recuérdame */
      .remember-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
        padding-left: 4px;
        cursor: pointer;
        user-select: none;
        color: #a1a1aa;
        font-size: 0.82rem;
        font-weight: 500;
      }

      .checkbox-v2 {
        accent-color: #0a84ff;
        width: 16px;
        height: 16px;
      }

      /* Botón Premium */
      .btn-v2 {
        width: 100%;
        background: #ffffff;
        color: #000000;
        border: none;
        border-radius: 50px;
        padding: 14px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .btn-v2:hover {
        background: #f4f4f5;
        transform: scale(1.01);
      }

      .btn-v2:active {
        transform: scale(0.98);
      }

      /* Contenedor de Error Sincronizado */
      #error-login-toast {
        background: rgba(255, 69, 58, 0.1);
        border: 1px solid rgba(255, 69, 58, 0.2);
        color: #ff453a;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 12px;
        border-radius: 12px;
        margin-bottom: 20px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div class="login-card-v2">
      <h2 class="login-title">Cybernet</h2>
      <p class="login-subtitle">Introduce tus credenciales autorizadas.</p>

      <!-- 🚨 CONTENEDOR DE ERRORES DINÁMICO (Sincronizado con logica.js) -->
      <div id="error-login-toast" style="display: none"></div>

      <form id="loginForm" onsubmit="validateStaffAccess(event)">
        <div class="input-group-v2">
          <input
            type="text"
            id="staffUser"
            class="input-v2"
            placeholder="Usuario"
            required
            autocomplete="username"
            spellcheck="false"
          />
          <input
            type="password"
            id="staffPass"
            class="input-v2"
            placeholder="Contraseña"
            required
            autocomplete="current-password"
          />
        </div>

        <!-- 🔒 CASILLERO RECUÉRDAME (Requerido por tu script de persistencia) -->
        <label class="remember-wrapper">
          <input type="checkbox" id="rememberMe" class="checkbox-v2" />
          <span>Mantener sesión iniciada</span>
        </label>

        <button type="submit" class="btn-v2">Verificar Identidad</button>
      </form>
    </div>

    <script src="logica.js"></script>
  </body>
</html>
