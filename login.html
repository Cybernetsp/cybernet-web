<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cybernet - Iniciar Sesión</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <h2>Cybernet OS</h2>
        <p class="subtitulo">Ingresa con tu correo y clave</p>

        <form id="formLogin" autocomplete="off">
          <div class="grupo-input">
            <label for="correo">Correo Electrónico</label>
            <input
              type="email"
              id="correo"
              placeholder="ejemplo@correo.com"
              required
            />
          </div>

          <div class="grupo-input">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" placeholder="••••••••" required />
          </div>

          <div id="mensajeError" class="mensaje-error"></div>

          <button type="submit" id="btnIngresar">Iniciar Sesión</button>
        </form>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
