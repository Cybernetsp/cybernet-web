<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cybernet Staff - Garantías</title>
    
    <link rel="icon" type="image/jpeg" href="logo.jpeg">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cybernet Garantías">
    
    <link rel="stylesheet" href="global.css">
    
    <style>
        /* Estructura Bento a 2 Columnas Optimizada */
        .garantia-container {
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 25px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding-top: 95px;
            padding-bottom: 50px;
            padding-left: 20px;
            padding-right: 20px;
        }

        /* Lista interna de tickets reportados compacta */
        .tickets-scroll-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 650px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .tickets-scroll-area::-webkit-scrollbar { width: 5px; }
        .tickets-scroll-area::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }

        /* 📱 TARJETAS DE TICKETS COMPACTAS (iOS Densidad Alta) */
        .ticket-card {
            background: var(--input-bg);
            border: var(--glass-border);
            border-radius: 16px;
            padding: 12px 16px; /* Reducido de 18px */
            display: flex;
            flex-direction: column;
            gap: 6px; /* Espaciado interno más cerrado */
            transition: var(--transition-spring);
        }
        .ticket-card:hover { border-color: var(--ios-blue); }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid rgba(255,255,255,0.08);
            padding-bottom: 6px;
            margin-bottom: 2px;
        }
        [data-theme="light"] .ticket-header { border-bottom-color: rgba(0,0,0,0.08); }

        /* Filas de datos en línea para ahorrar un 40% de espacio */
        .ticket-data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 4px 15px;
            font-size: 0.85rem;
        }

        .ticket-desc {
            font-size: 0.82rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px; /* Más compacto */
            border-radius: 10px;
            margin-top: 2px;
            border: 0.5px solid rgba(255,255,255,0.04);
            line-height: 1.3;
            color: var(--text-primary);
        }
        [data-theme="light"] .ticket-desc { background: rgba(255,255,255,0.4); border-color: rgba(0,0,0,0.04); }

        /* Botones operativos más delgados */
        .ticket-card .btn-ios {
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 10px;
        }
        
        @media (max-width: 900px) {
            .garantia-container { grid-template-columns: 1fr; padding-top: 130px; }
            .global-header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .ticket-data-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="bg-orb bg-orb-1" style="background: rgba(255, 69, 58, 0.12);"></div>
    <div class="bg-orb bg-orb-2" style="background: rgba(10, 132, 255, 0.12);"></div>

    <header class="global-header" id="globalHeader">
        <div class="flex-row" id="staffStatusBar">
            <div class="badge-ios badge-blue">
                <span id="staffSessionName">STAFF</span> • PANEL DE GARANTÍAS
            </div>
            <div class="badge-ios badge-green" id="timerBadgeContainer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="shiftTimer">00:00:00</span>
            </div>
        </div>

        <div class="flex-row">
            <button class="btn-ios btn-secondary" onclick="window.location.href='admin.html'">
                ← Volver al Panel
            </button>
        </div>
    </header>

    <div class="overlay-ios" id="resolverOverlay">
        <div class="sheet-ios" onclick="event.stopPropagation()" style="height: auto; padding-bottom: 40px;">
            <div class="sheet-header">
                <h3 class="card-title" style="color: var(--ios-green);">✅ Resolver Cuenta</h3>
                <button class="btn-close-circle" onclick="cerrarModalResolver()">✕</button>
            </div>
            <p class="text-secondary mb-1" style="font-size: 0.9rem;">Ingresa los nuevos datos de acceso para solucionar este reporte.</p>
            
            <form id="formResolverGarantia" class="flex-col" onsubmit="ejecutarResolverGarantia(event)">
                <input type="hidden" id="resolverFila">
                <input type="hidden" id="resolverCorreoViejo">
                <input type="hidden" id="resolverPlataforma">

                <input type="email" id="resNuevoCorreo" class="input-ios" placeholder="Nuevo Correo Asignado" required>
                <input type="text" id="resNuevaClave" class="input-ios" placeholder="Nueva Contraseña" required>
                
                <button type="submit" id="btnSubmitResolver" class="btn-ios btn-success w-100 mt-1">Guardar y Resolver</button>
                <button type="button" class="btn-ios btn-secondary w-100" onclick="cerrarModalResolver()">Cancelar</button>
            </form>
        </div>
    </div>

    <div class="garantia-container">
        
        <div class="card-ios" style="height: fit-content;">
            <h2 class="card-title" style="color: var(--ios-red); margin-bottom: 10px;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                Reportar Problema
            </h2>
            
            <form id="formReportar" class="flex-col" onsubmit="ejecutarReporte(event)">
                <select id="repPlataforma" class="input-ios" style="margin-bottom: 0;" required>
                    <option value="" disabled selected>Selecciona la Plataforma...</option>
                    <option value="NETFLIX">NETFLIX</option>
                    <option value="AMAZON-PRIME-VIDEO">AMAZON PRIME VIDEO</option>
                    <option value="DISNEY-PREMIUM">DISNEY PREMIUM</option>
                    <option value="HBO-MAX">HBO MAX</option>
                    <option value="DISNEY-ESTANDAR">DISNEY ESTANDAR</option>
                    <option value="PLEX">PLEX</option>
                    <option value="CRUNCHYROLL">CRUNCHYROLL</option>
                    <option value="VIX">VIX</option>
                    <option value="PARAMOUNT">PARAMOUNT</option>
                    <option value="METEGOL">METEGOL</option>
                    <option value="CANVA">CANVA</option>
                    <option value="CAPCUT">CAPCUT</option>
                    <option value="SPOTIFY">SPOTIFY</option>
                    <option value="YOUTUBE">YOUTUBE</option>
                    <option value="DEEZER">DEEZER</option>
                </select>

                <input type="email" id="repCorreo" class="input-ios" style="margin-bottom: 0;" placeholder="Correo de la cuenta" required autocomplete="off">
                <input type="text" id="repClave" class="input-ios" style="margin-bottom: 0;" placeholder="Contraseña actual" required autocomplete="off">
                
                <select id="repTipoProblema" class="input-ios" style="margin-bottom: 0;" required onchange="verificarTipoProblema()">
                    <option value="" disabled selected>Selecciona el tipo de problema...</option>
                    <option value="CUENTA CAIDA">CUENTA CAÍDA</option>
                    <option value="CONTRASEÑA INCORRECTA">CONTRASEÑA INCORRECTA</option>
                    <option value="CUENTA BLOQUEADA">CUENTA BLOQUEADA</option>
                    <option value="OTRA">OTRA (Explicar detalladamente)</option>
                </select>

                <textarea id="repDesc" class="input-ios" placeholder="Por favor, explica el problema detalladamente..." style="display: none; min-height: 100px; margin-bottom: 0;"></textarea>
                
                <button type="submit" id="btnSubmitReporte" class="btn-ios btn-danger w-100 mt-1" style="padding: 15px; font-size:1.05rem;">
                    Enviar a Garantía
                </button>
            </form>
        </div>

        <div class="card-ios">
            <div class="flex-row-between mb-1" style="border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px;">
                <h2 class="card-title" style="color: var(--ios-blue);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                    Cuentas Reportadas
                </h2>
                <button class="btn-ios btn-secondary" style="padding: 6px 14px; font-size:0.8rem;" onclick="cargarGarantias()">
                    🔄 Actualizar
                </button>
            </div>

            <div class="tickets-scroll-area" id="listaGarantias">
                <div style="text-align:center; padding:30px; color:var(--text-secondary); font-size:0.9rem;">
                    ⏳ Cargando garantías pendientes...
                </div>
            </div>
        </div>

    </div>

    <div id="globalToast" class="overlay-ios" style="background:transparent; pointer-events:none; z-index:10001;">
        <div style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(30,30,35,0.95); backdrop-filter:blur(15px); border:var(--glass-border); color:white; padding:12px 24px; border-radius:30px; font-size:0.9rem; font-weight:600; box-shadow:var(--glass-shadow); display:flex; align-items:center; gap:8px;">
            <span id="toastIcon">✅</span>
            <span id="toastText">Acción completada</span>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWdHzqlwlAWcCuXngcurIIrZVCHl5QEhRUkHTL90dhNqfm1iXnvSvDli5G_r6zlmHY/exec";
        
        let isFetchingGarantias = false;
        let timerInterval = null;
        let temporizadorInactividad = null;
        const INACTIVITY_LOGOUT_LIMIT = 30 * 60 * 1000;
        let isTimerPaused = false;

        function haptic() { 
            if (navigator.vibrate) navigator.vibrate(15); 
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('globalToast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');

            toastText.innerText = message;
            toastIcon.innerText = isError ? "❌" : "✅";
            toast.classList.add('open');
            setTimeout(() => { toast.classList.remove('open'); }, 3000);
        }

        function verificarTipoProblema() {
            const select = document.getElementById('repTipoProblema');
            const textarea = document.getElementById('repDesc');
            
            if (select.value === 'OTRA') {
                textarea.style.display = 'block';
                textarea.setAttribute('required', 'true');
                textarea.focus();
            } else {
                textarea.style.display = 'none';
                textarea.removeAttribute('required');
                textarea.value = ''; 
            }
        }

        function ejecutarReporte(e) {
            e.preventDefault();
            haptic();
            
            const btnSubmit = document.getElementById('btnSubmitReporte');
            const plataforma = document.getElementById('repPlataforma').value;
            const correo = document.getElementById('repCorreo').value;
            const clave = document.getElementById('repClave').value;
            
            const tipoProblema = document.getElementById('repTipoProblema').value;
            let descripcion = tipoProblema; 
            
            if (tipoProblema === 'OTRA') {
                descripcion = document.getElementById('repDesc').value.trim();
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "⏳ Enviando Reporte...";

            const oldScript = document.getElementById('cyber_reporte_node');
            if (oldScript) oldScript.remove();

            window.procesarReporteSheets = function(res) {
                const scriptNode = document.getElementById('cyber_reporte_node');
                if (scriptNode) scriptNode.remove();

                btnSubmit.disabled = false;
                btnSubmit.innerText = "Enviar a Garantía";

                if (res && res.status === "success") {
                    showToast(res.message);
                    document.getElementById('formReportar').reset();
                    verificarTipoProblema(); 
                    cargarGarantias(); 
                } else {
                    showToast("Error: " + (res ? res.message : "Desconocido"), true);
                }
            };

            const scriptElement = document.createElement('script');
            scriptElement.id = 'cyber_reporte_node';
            let queryParams = `?action=reportarGarantia&plataforma=${encodeURIComponent(plataforma)}&correo=${encodeURIComponent(correo)}&clave=${encodeURIComponent(clave)}&descripcion=${encodeURIComponent(descripcion)}&callback=procesarReporteSheets&_ts=${Date.now()}`;
            scriptElement.src = GOOGLE_SCRIPT_URL + queryParams;
            document.body.appendChild(scriptElement);
        }

        function cargarGarantias() {
            if (isFetchingGarantias) return;
            isFetchingGarantias = true;
            haptic();

            const container = document.getElementById('listaGarantias');
            container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-secondary); font-size:0.9rem;">⏳ Sincronizando tickets...</div>';

            const oldScript = document.getElementById('cyber_getgarantias_node');
            if (oldScript) oldScript.remove();

            window.procesarListaGarantiasSheets = function(res) {
                isFetchingGarantias = false;
                const scriptNode = document.getElementById('cyber_getgarantias_node');
                if (scriptNode) scriptNode.remove();

                if (res && res.status === "success") {
                    renderizarListaGarantias(res.data);
                } else {
                    container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--ios-red); font-weight:600;">❌ Error al cargar garantías.</div>';
                }
            };

            const scriptElement = document.createElement('script');
            scriptElement.id = 'cyber_getgarantias_node';
            let queryParams = `?action=obtenerGarantias&callback=procesarListaGarantiasSheets&_ts=${Date.now()}`;
            scriptElement.src = GOOGLE_SCRIPT_URL + queryParams;
            document.body.appendChild(scriptElement);
        }

        // 📊 REDISEÑO ULTRA COMPACTO AQUÍ (MODERNO E INLINE)
        function renderizarListaGarantias(data) {
            const container = document.getElementById('listaGarantias');
            
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-secondary); font-weight:600;">✨ No hay cuentas en garantía en este momento.</div>';
                return;
            }

            let html = "";
            data.forEach((item, index) => {
                const textoReporte = `🚨 *REPORTE DE PROBLEMA*\n📺 *Plataforma:* ${item.plataforma}\n📧 *Correo:* ${item.correo}\n🔑 *Clave:* ${item.clave}\n👤 *Proveedor:* ${item.proveedor}\n📅 *Fecha de Compra:* ${item.fechaCompra || "No Registrada"}\n💬 *Motivo:* ${item.desc}`;
                const safeReporte = encodeURIComponent(textoReporte);

                html += `
                <div class="ticket-card">
                    <div class="ticket-header">
                        <span style="color:var(--ios-blue); font-weight:800; font-size:1.05rem;">
                            ${item.plataforma}
                        </span>
                        <div style="font-size: 0.72rem; color: var(--text-secondary); text-align: right; line-height: 1.2;">
                            Reporte: <strong>${item.fecha}</strong><br>
                            Compra: <strong>${item.fechaCompra || "N/A"}</strong>
                        </div>
                    </div>
                    
                    <div class="ticket-data-grid">
                        <div>Correo: <span style="color:var(--ios-red); user-select:all; font-weight:600;">${item.correo}</span></div>
                        <div>Clave: <span style="color:var(--text-primary); font-weight:600; user-select:all;">${item.clave}</span></div>
                        <div>Proveedor: <span style="color:var(--ios-orange); font-weight:600;">${item.proveedor}</span></div>
                    </div>
                    
                    <div class="ticket-desc">
                        💬 ${item.desc}
                    </div>
                    
                    <div class="flex-row mt-1" style="width:100%; gap: 10px;">
                        <button class="btn-ios btn-secondary" style="flex:1;" onclick="copiarReporteAlPortapapeles('${safeReporte}', this)">
                            Copiar Reporte
                        </button>
                        
                        <button class="btn-ios btn-success" style="flex:1;" onclick="abrirModalResolver('${item.filaIndex}', '${item.correo}', '${item.plataforma}')">
                            Resolver Cuenta
                        </button>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function copiarReporteAlPortapapeles(textoEncodeado, btnElement) {
            haptic();
            const texto = decodeURIComponent(textoEncodeado);

            navigator.clipboard.writeText(texto).then(() => {
                efectoBotonCopiadoReporte(btnElement);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = texto;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                textarea.remove();
                efectoBotonCopiadoReporte(btnElement);
            });
        }

        function efectoBotonCopiadoReporte(btn) {
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '¡Copiado! ✔️';
            btn.style.background = 'var(--ios-orange)';
            btn.style.color = '#ffffff';

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.style.background = '';
                btn.style.color = '';
            }, 1500);
        }

        function abrirModalResolver(fila, correo, plataforma) {
            haptic();
            document.getElementById('resolverFila').value = fila;
            document.getElementById('resolverCorreoViejo').value = correo;
            document.getElementById('resolverPlataforma').value = plataforma;
            document.getElementById('resNuevoCorreo').value = correo;
            document.getElementById('resolverOverlay').classList.add('open');
        }

        function cerrarModalResolver() {
            document.getElementById('resolverOverlay').classList.remove('open');
            document.getElementById('formResolverGarantia').reset();
        }

        function ejecutarResolverGarantia(e) {
            e.preventDefault();
            haptic();

            const btnSubmit = document.getElementById('btnSubmitResolver');
            const fila = document.getElementById('resolverFila').value;
            const plat = document.getElementById('resolverPlataforma').value;
            const correoViejo = document.getElementById('resolverCorreoViejo').value;
            const nuevoCorreo = document.getElementById('resNuevoCorreo').value;
            const nuevaClave = document.getElementById('resNuevaClave').value;

            btnSubmit.disabled = true;
            btnSubmit.innerText = "⏳ Guardando Solución...";

            const oldScript = document.getElementById('cyber_resolver_node');
            if (oldScript) oldScript.remove();

            window.procesarResolucionSheets = function(res) {
                const scriptNode = document.getElementById('cyber_resolver_node');
                if (scriptNode) scriptNode.remove();

                btnSubmit.disabled = false;
                btnSubmit.innerText = "Guardar y Resolver";

                if (res && res.status === "success") {
                    showToast(res.message);
                    cerrarModalResolver();
                    cargarGarantias(); 
                } else {
                    showToast("Error: " + (res ? res.message : "Desconocido"), true);
                }
            };

            const scriptElement = document.createElement('script');
            scriptElement.id = 'cyber_resolver_node';
            let queryParams = `?action=resolverGarantia&filaIndex=${encodeURIComponent(fila)}&plataforma=${encodeURIComponent(plat)}&correoViejo=${encodeURIComponent(correoViejo)}&nuevoCorreo=${encodeURIComponent(nuevoCorreo)}&nuevaClave=${encodeURIComponent(nuevaClave)}&callback=procesarResolucionSheets&_ts=${Date.now()}`;
            scriptElement.src = GOOGLE_SCRIPT_URL + queryParams;
            document.body.appendChild(scriptElement);
        }

        function startShiftTimer() {
            if (!sessionStorage.getItem('cyber_shift_start_time')) {
                sessionStorage.setItem('cyber_shift_start_time', Date.now());
            }
            if (!sessionStorage.getItem('cyber_shift_accumulated_time')) {
                sessionStorage.setItem('cyber_shift_accumulated_time', 0);
            }

            if (timerInterval) {
                clearInterval(timerInterval);
            }

            timerInterval = setInterval(function() {
                if (isTimerPaused) return; 
                
                let startTime = parseInt(sessionStorage.getItem('cyber_shift_start_time'));
                let accumulated = parseInt(sessionStorage.getItem('cyber_shift_accumulated_time'));
                if (isNaN(accumulated)) accumulated = 0;
                
                let elapsed = Date.now() - startTime;
                let totalMs = accumulated + elapsed;
                
                let totalSeconds = Math.floor(totalMs / 1000);
                let hours = Math.floor(totalSeconds / 3600);
                let minutes = Math.floor((totalSeconds % 3600) / 60);
                let seconds = totalSeconds % 60;

                let hStr = String(hours).padStart(2, '0');
                let mStr = String(minutes).padStart(2, '0');
                let sStr = String(seconds).padStart(2, '0');

                let stElement = document.getElementById('shiftTimer');
                if (stElement) stElement.innerText = hStr + ":" + mStr + ":" + sStr;
            }, 1000);
        }

        function resetearInactividad() {
            if (!sessionStorage.getItem('active_staff')) return;
            if (temporizadorInactividad) clearTimeout(temporizadorInactividad);
            temporizadorInactividad = setTimeout(() => {
                if (sessionStorage.getItem('active_staff')) {
                    alert("⏳ Tu sesión se ha cerrado automáticamente tras 30 minutos de inactividad.");
                    window.location.href = 'admin.html';
                }
            }, INACTIVITY_LOGOUT_LIMIT);
        }

        function iniciarControlInactividad() {
            window.addEventListener('mousemove', resetearInactividad);
            window.addEventListener('keypress', resetearInactividad);
            window.addEventListener('click', resetearInactividad);
            window.addEventListener('scroll', resetearInactividad);
            window.addEventListener('touchstart', resetearInactividad);
            resetearInactividad(); 
        }

        window.addEventListener('DOMContentLoaded', () => {
            const activeUser = sessionStorage.getItem('active_staff');
            if(activeUser) {
                document.getElementById('staffSessionName').innerText = activeUser.toUpperCase();
                
                if (activeUser.toUpperCase() !== "CAMILO") {
                    startShiftTimer();
                    iniciarControlInactividad();
                } else {
                    const timerBadge = document.getElementById('timerBadgeContainer');
                    if (timerBadge) {
                        timerBadge.style.display = 'none';
                    }
                }
            }

            let savedTheme = localStorage.getItem('cyber_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);

            cargarGarantias(); 
        });
    </script>
</body>
</html>
