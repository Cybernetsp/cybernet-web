<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cybernet Staff - Garantías</title>
    
    <link rel="icon" type="image/jpeg" href="logo.jpeg">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cybernet Garantías">
    
    <style>
        /* ========================================================================= */
        /* VARIABLES GLOBALES Y RESETEO BÁSICO */
        /* ========================================================================= */
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #151822;
            --glass-bg: rgba(20, 20, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #8b92a5;
            --ios-blue: #3b82f6;
            --ios-green: #30d158;
            --ios-red: #ff453a;
            --ios-orange: #ff9f0a;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg-color: #f3f4f6;
            --panel-bg: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --ios-blue: #2563eb;
            --ios-green: #34c759;
            --ios-red: #ff3b30;
            --ios-orange: #ff9500;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- ANIMACIONES Y FONDOS EN MOVIMIENTO (ORBES) --- */
        .bg-orb-1, .bg-orb-2 {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
            pointer-events: none;
        }

        .bg-orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(255, 69, 58, 0.15); /* Rojo Garantías */
            top: -100px;
            left: -100px;
        }

        .bg-orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(10, 132, 255, 0.15); /* Azul Info */
            bottom: -150px;
            right: -100px;
            animation-delay: -10s;
        }

        [data-theme="light"] .bg-orb-1 { background: rgba(255, 59, 48, 0.1); filter: blur(60px); }
        [data-theme="light"] .bg-orb-2 { background: rgba(0, 122, 255, 0.1); filter: blur(60px); }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
            100% { transform: translate(-30px, 50px) scale(0.9); }
        }

        @keyframes pulseIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- ESTILOS ESPECÍFICOS PARA EL MÓDULO DE GARANTÍAS --- */
        #globalHeader {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            padding: 15px 25px !important;
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            min-height: 65px !important;
            box-sizing: border-box !important;
            z-index: 9998 !important;
            background-color: rgba(15, 15, 20, 0.85) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        [data-theme="light"] #globalHeader {
            background-color: rgba(245, 245, 247, 0.85) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1) !important;
        }

        .top-left-status {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .staff-badge {
            background: rgba(10, 132, 255, 0.15);
            color: var(--ios-blue);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid rgba(10, 132, 255, 0.3);
            text-transform: uppercase;
        }

        .timer-badge {
            background: rgba(48, 209, 88, 0.15);
            color: var(--ios-green);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid rgba(48, 209, 88, 0.3);
            display: flex;
            align-items: center;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .circle-control {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .circle-control:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        [data-theme="light"] .circle-control:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        .btn-back-header {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        [data-theme="light"] .btn-back-header { background: rgba(0,0,0,0.03); }

        .btn-back-header:hover {
            background: var(--ios-blue);
            color: white;
            border-color: var(--ios-blue);
        }

        /* ESTRUCTURA A 2 COLUMNAS */
        .garantia-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr; /* Ligeramente más ancho el panel de reportadas */
            gap: 30px;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding-top: 100px;
            padding-bottom: 50px;
            padding-left: 20px;
            padding-right: 20px;
        }

        .section-panel {
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: fit-content;
        }

        .panel-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        [data-theme="light"] .panel-header {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .panel-header h2 {
            font-size: 1.3rem;
            color: var(--text-primary);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action-panel {
            background: rgba(10, 132, 255, 0.15);
            color: var(--ios-blue);
            border: 1px solid rgba(10, 132, 255, 0.3);
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-action-panel:hover {
            background: var(--ios-blue);
            color: white;
        }

        /* FORMULARIO Y SELECTS */
        .ios-input-block {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        [data-theme="light"] .ios-input-block {
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .ios-input-block:focus {
            border-color: var(--ios-blue);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.2);
        }

        select.ios-input-block {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
            cursor: pointer;
        }

        select.ios-input-block option {
            background-color: #1c1c1e;
            color: #ffffff;
        }

        [data-theme="light"] select.ios-input-block option {
            background-color: #ffffff;
            color: #000000;
        }

        textarea.ios-input-block {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }

        .btn-submit-main {
            background: linear-gradient(135deg, #ff453a 0%, #ff3b30 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 69, 58, 0.3);
            margin-top: 5px;
        }

        .btn-submit-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 69, 58, 0.5);
        }

        .btn-submit-main:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* LISTA DE TICKETS DE GARANTÍA */
        .tickets-scroll-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 650px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .tickets-scroll-area::-webkit-scrollbar {
            width: 6px;
        }
        .tickets-scroll-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .tickets-scroll-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .ticket-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        [data-theme="light"] .ticket-card {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0,0,0,0.08);
        }

        .ticket-card:hover {
            transform: translateY(-2px);
            border-color: var(--ios-blue);
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
            margin-bottom: 5px;
        }

        [data-theme="light"] .ticket-header { border-bottom: 1px solid rgba(0,0,0,0.05); }

        .platform-tag {
            color: var(--ios-blue);
            font-weight: 800;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ticket-date {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: right;
        }

        .ticket-field {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .ticket-field span {
            color: var(--text-primary);
            font-weight: 600;
            user-select: all;
        }

        .ticket-desc {
            font-size: 0.9rem;
            color: var(--text-primary);
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 10px;
            margin-top: 5px;
            border: 1px solid rgba(255,255,255,0.05);
            line-height: 1.4;
        }

        [data-theme="light"] .ticket-desc {
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .ticket-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-resolver {
            flex: 1;
            background: rgba(48, 209, 88, 0.15);
            color: var(--ios-green);
            border: 1px solid rgba(48, 209, 88, 0.3);
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .btn-resolver:hover {
            background: var(--ios-green);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(48, 209, 88, 0.3);
        }

        .btn-copy-report {
            flex: 1;
            background: rgba(255, 159, 10, 0.15);
            color: var(--ios-orange);
            border: 1px solid rgba(255, 159, 10, 0.3);
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .btn-copy-report:hover {
            background: var(--ios-orange);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 159, 10, 0.3);
        }

        /* --- MODAL RESOLVER OVERLAY --- */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .password-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .password-card {
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: scale(0.95) translateY(20px);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .password-overlay.open .password-card {
            transform: scale(1) translateY(0);
        }

        .btn-modal-cancel {
            background: rgba(118, 118, 128, 0.2);
            color: var(--text-primary);
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-modal-cancel:hover { background: rgba(118, 118, 128, 0.3); }

        .btn-modal-submit {
            background: linear-gradient(135deg, #30d158 0%, #248a3d 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(48, 209, 88, 0.3);
            margin-top: 10px;
        }
        .btn-modal-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(48, 209, 88, 0.4);
        }

        /* --- TOAST --- */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(30, 30, 35, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 10001;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 900px) {
            .garantia-container {
                grid-template-columns: 1fr;
                padding-top: 130px;
            }
            #globalHeader {
                flex-direction: column !important;
                align-items: flex-start !important;
                padding: 15px 20px !important;
                gap: 15px !important;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-end;
            }
            .ticket-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="bg-orb-1"></div>
    <div class="bg-orb-2"></div>

    <header class="global-header" id="globalHeader">
        <div class="top-left-status" id="staffStatusBar">
            <div class="staff-badge">
                <span id="staffSessionName">STAFF</span> • PANEL DE GARANTÍAS
            </div>
            <div class="timer-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right: 4px; vertical-align: middle;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="shiftTimer">00:00:00</span>
            </div>
        </div>

        <div class="header-actions">
            <button class="circle-control" onclick="toggleTheme()" id="theme-toggle" aria-label="Cambiar Tema">
                </button>
            <button class="btn-back-header" onclick="window.location.href='admin.html'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Volver al Panel
            </button>
        </div>
    </header>

    <div class="password-overlay" id="resolverOverlay">
        <div class="password-card" onclick="event.stopPropagation()">
            <h3 style="color: var(--ios-green); margin-bottom: 5px; font-size: 1.3rem;">✅ Resolver Cuenta</h3>
            <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 20px;">Ingresa los nuevos datos de acceso para solucionar este reporte.</p>
            
            <form id="formResolverGarantia" onsubmit="ejecutarResolverGarantia(event)">
                <input type="hidden" id="resolverFila">
                <input type="hidden" id="resolverCorreoViejo">
                <input type="hidden" id="resolverPlataforma">

                <input type="email" id="resNuevoCorreo" class="ios-input-block" placeholder="Nuevo Correo Asignado" required>
                <input type="text" id="resNuevaClave" class="ios-input-block" placeholder="Nueva Contraseña" required>
                
                <button type="submit" id="btnSubmitResolver" class="btn-modal-submit">Guardar y Resolver</button>
                <button type="button" class="btn-modal-cancel" onclick="cerrarModalResolver()">Cancelar</button>
            </form>
        </div>
    </div>

    <div class="garantia-container">
        
        <div class="section-panel">
            <div class="panel-header">
                <h2>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ios-red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    Reportar Problema
                </h2>
            </div>
            
            <form id="formReportar" onsubmit="ejecutarReporte(event)">
                <select id="repPlataforma" class="ios-input-block" required>
                    <option value="" disabled selected>Selecciona la Plataforma...</option>
                    <option value="NETFLIX">NETFLIX</option>
                    <option value="AMAZON-PRIME-VIDEO">AMAZON PRIME VIDEO</option>
                    <option value="DISNEY-PREMIUM">DISNEY PREMIUM</option>
                    <option value="HBO-MAX">HBO MAX</option>
                    <option value="DISNEY-ESTANDAR">DISNEY ESTANDAR</option>
                    <option value="PLEX">PLEX</option>
                    <option value="CRUNCHYROLL">CRUNCHYROLL</option>
                    <option value="VIX">VIX</option>
                    <option value="PARAMOUNT">PARAMOUNT</option>
                    <option value="METEGOL">METEGOL</option>
                    <option value="CANVA">CANVA</option>
                    <option value="CAPCUT">CAPCUT</option>
                    <option value="SPOTIFY">SPOTIFY</option>
                    <option value="YOUTUBE">YOUTUBE</option>
                    <option value="DEEZER">DEEZER</option>
                </select>

                <input type="email" id="repCorreo" class="ios-input-block" placeholder="Correo de la cuenta" required autocomplete="off">
                <input type="text" id="repClave" class="ios-input-block" placeholder="Contraseña actual" required autocomplete="off">
                
                <select id="repTipoProblema" class="ios-input-block" required onchange="verificarTipoProblema()">
                    <option value="" disabled selected>Selecciona el tipo de problema...</option>
                    <option value="CUENTA CAIDA">CUENTA CAÍDA</option>
                    <option value="CONTRASEÑA INCORRECTA">CONTRASEÑA INCORRECTA</option>
                    <option value="CUENTA BLOQUEADA">CUENTA BLOQUEADA</option>
                    <option value="OTRA">OTRA (Explicar detalladamente)</option>
                </select>

                <textarea id="repDesc" class="ios-input-block" placeholder="Por favor, explica el problema detalladamente..." style="display: none;"></textarea>
                
                <button type="submit" id="btnSubmitReporte" class="btn-submit-main">
                    Enviar a Garantía
                </button>
            </form>
        </div>

        <div class="section-panel">
            <div class="panel-header">
                <h2>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--ios-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Cuentas Reportadas
                </h2>
                <button class="btn-action-panel" onclick="cargarGarantias()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    Actualizar
                </button>
            </div>

            <div class="tickets-scroll-area" id="listaGarantias">
                <div style="text-align:center; padding:30px; color:var(--text-secondary); font-size:0.9rem;">
                    ⏳ Cargando garantías pendientes...
                </div>
            </div>
        </div>

    </div>

    <div id="globalToast" class="toast-notification">
        <span id="toastIcon">✅</span>
        <span id="toastText">Acción completada</span>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN INICIAL
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrS-4VDLyhfNkClPwIXq-bjPTUMg0i84opsKclyYc3Nrx4usk6hSYAJDbdD31vxa5R/exec";
        let isFetchingGarantias = false;
        
        // VARIABLES DEL CRONÓMETRO Y SESIÓN
        let timerInterval = null;
        let temporizadorInactividad = null;
        const INACTIVITY_LOGOUT_LIMIT = 30 * 60 * 1000;
        let isTimerPaused = false;

        function haptic() { 
            if (navigator.vibrate) navigator.vibrate(15); 
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('globalToast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');

            toastText.innerText = message;
            toastIcon.innerText = isError ? "❌" : "✅";
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // ==========================================
        // TEMAS CLARO/OSCURO
        // ==========================================
        function toggleTheme() {
            haptic();
            const currentTheme = document.documentElement.getAttribute('data-theme');
            let newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('cyber_theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const btn = document.getElementById('theme-toggle');
            if (!btn) return;
            if (theme === 'light') {
                btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
            } else {
                btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
            }
        }

        // ==========================================
        // 1. MOSTRAR/OCULTAR TEXTAREA DE PROBLEMA
        // ==========================================
        function verificarTipoProblema() {
            const select = document.getElementById('repTipoProblema');
            const textarea = document.getElementById('repDesc');
            
            if (select.value === 'OTRA') {
                textarea.style.display = 'block';
                textarea.setAttribute('required', 'true');
                textarea.focus();
            } else {
                textarea.style.display = 'none';
                textarea.removeAttribute('required');
                textarea.value = ''; // Limpiar si el usuario se arrepiente y cambia de opción
            }
        }

        // ==========================================
        // 2. FUNCIÓN PARA REPORTAR UNA CUENTA
        // ==========================================
        function ejecutarReporte(e) {
            e.preventDefault();
            haptic();
            
            const btnSubmit = document.getElementById('btnSubmitReporte');
            const plataforma = document.getElementById('repPlataforma').value;
            const correo = document.getElementById('repCorreo').value;
            const clave = document.getElementById('repClave').value;
            
            // Lógica para capturar la descripción correcta
            const tipoProblema = document.getElementById('repTipoProblema').value;
            let descripcion = tipoProblema; // Por defecto es "CUENTA CAIDA", etc.
            
            if (tipoProblema === 'OTRA') {
                descripcion = document.getElementById('repDesc').value.trim();
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "⏳ Enviando Reporte...";

            const oldScript = document.getElementById('cyber_reporte_node');
            if (oldScript) oldScript.remove();

            window.procesarReporteSheets = function(res) {
                const scriptNode = document.getElementById('cyber_reporte_node');
                if (scriptNode) scriptNode.remove();

                btnSubmit.disabled = false;
                btnSubmit.innerText = "Enviar a Garantía";

                if (res && res.status === "success") {
                    showToast(res.message);
                    document.getElementById('formReportar').reset();
                    verificarTipoProblema(); // Ocultar el textarea de nuevo
                    cargarGarantias(); // Refrescar la lista de al lado automáticamente
                } else {
                    showToast("Error: " + (res ? res.message : "Desconocido"), true);
                }
            };

            const scriptElement = document.createElement('script');
            scriptElement.id = 'cyber_reporte_node';
            let queryParams = `?action=reportarGarantia&plataforma=${encodeURIComponent(plataforma)}&correo=${encodeURIComponent(correo)}&clave=${encodeURIComponent(clave)}&descripcion=${encodeURIComponent(descripcion)}&callback=procesarReporteSheets&_ts=${Date.now()}`;
            scriptElement.src = GOOGLE_SCRIPT_URL + queryParams;
            document.body.appendChild(scriptElement);
        }

        // ==========================================
        // 3. OBTENER LISTA DE REPORTADAS
        // ==========================================
        function cargarGarantias() {
            if (isFetchingGarantias) return;
            isFetchingGarantias = true;
            haptic();

            const container = document.getElementById('listaGarantias');
            container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-secondary); font-size:0.9rem;">⏳ Sincronizando tickets...</div>';

            const oldScript = document.getElementById('cyber_getgarantias_node');
            if (oldScript) oldScript.remove();

            window.procesarListaGarantiasSheets = function(res) {
                isFetchingGarantias = false;
                const scriptNode = document.getElementById('cyber_getgarantias_node');
                if (scriptNode) scriptNode.remove();

                if (res && res.status === "success") {
                    renderizarListaGarantias(res.data);
                } else {
                    container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--ios-red); font-weight:600;">❌ Error al cargar garantías.</div>';
                }
            };

            const scriptElement = document.createElement('script');
            scriptElement.id = 'cyber_getgarantias_node';
            let queryParams = `?action=obtenerGarantias&callback=procesarListaGarantiasSheets&_ts=${Date.now()}`;
            scriptElement.src = GOOGLE_SCRIPT_URL + queryParams;
            document.body.appendChild(scriptElement);
        }

        function renderizarListaGarantias(data) {
            const container = document.getElementById('listaGarantias');
            
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-secondary); font-weight:600;">✨ No hay cuentas en garantía en este momento.</div>';
                return;
            }

            let html = "";
            data.forEach((item, index) => {
                
                // Formateamos el texto del reporte para que pueda ser copiado fácilmente
                const textoReporte = `🚨 *REPORTE DE PROBLEMA*\n📺 *Plataforma:* ${item.plataforma}\n📧 *Correo:* ${item.correo}\n🔑 *Clave:* ${item.clave}\n👤 *Proveedor:* ${item.proveedor}\n📅 *Fecha de Compra:* ${item.fechaCompra || "No Registrada"}\n💬 *Motivo:* ${item.desc}`;
                const safeReporte = encodeURIComponent(textoReporte);

                html += `
                <div class="ticket-card">
                    <div class="ticket-header">
                        <span class="platform-tag">
                            ${item.plataforma}
                        </span>
                        <div class="ticket-date">
                            Reporte: <strong>${item.fecha}</strong><br>
                            Compra: <strong>${item.fechaCompra || "N/A"}</strong>
                        </div>
                    </div>
                    <div class="ticket-field">Correo: <span style="color:var(--ios-red); user-select:all;">${item.correo}</span></div>
                    <div class="ticket-field">Clave: <span style="user-select:all;">${item.clave}</span></div>
                    <div class="ticket-field">Proveedor: <span style="color:var(--ios-orange);">${item.proveedor}</span></div>
                    <div class="ticket-desc">💬 ${item.desc}</div>
                    
                    <div class="ticket-actions">
                        <button class="btn-copy-report" onclick="copiarReporteAlPortapapeles('${safeReporte}', this)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            Copiar Reporte
                        </button>
                        
                        <button class="btn-resolver" onclick="abrirModalResolver('${item.filaIndex}', '${item.correo}', '${item.plataforma}')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                            Resolver Cuenta
                        </button>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        // ==========================================
        // 4. FUNCIONES DE COPIADO DE REPORTE
        // ==========================================
        function copiarReporteAlPortapapeles(textoEncodeado, btnElement) {
            haptic();
            const texto = decodeURIComponent(textoEncodeado);

            navigator.clipboard.writeText(texto).then(() => {
                efectoBotonCopiadoReporte(btnElement);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = texto;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                textarea.remove();
                efectoBotonCopiadoReporte(btnElement);
            });
        }

        function efectoBotonCopiadoReporte(btn) {
            const originalHTML = btn.innerHTML;
            const originalBg = btn.style.background;
            const originalColor = btn.style.color;

            btn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                ¡Copiado!
            `;
            btn.style.background = 'var(--ios-orange)';
            btn.style.color = '#ffffff';

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.style.background = originalBg;
                btn.style.color = originalColor;
            }, 1500);
        }

        // ==========================================
        // 5. FUNCIONES DEL MODAL PARA RESOLVER
        // ==========================================
        function abrirModalResolver(fila, correo, plataforma) {
            haptic();
            document.getElementById('resolverFila').value = fila;
            document.getElementById('resolverCorreoViejo').value = correo;
            document.getElementById('resolverPlataforma').value = plataforma;
            
            document.getElementById('resNuevoCorreo').value = correo;
            
            document.getElementById('resolverOverlay').classList.add('open');
        }

        function cerrarModalResolver() {
            document.getElementById('resolverOverlay').classList.remove('open');
            document.getElementById('formResolverGarantia').reset();
        }

        function ejecutarResolverGarantia(e) {
            e.preventDefault();
            haptic();

            const btnSubmit = document.getElementById('btnSubmitResolver');
            const fila = document.getElementById('resolverFila').value;
            const plat = document.getElementById('resolverPlataforma').value;
            const correoViejo = document.getElementById('resolverCorreoViejo').value;
            const nuevoCorreo = document.getElementById('resNuevoCorreo').value;
            const nuevaClave = document.getElementById('resNuevaClave').value;

            btnSubmit.disabled = true;
            btnSubmit.innerText = "⏳ Guardando Solución...";

            const oldScript = document.getElementById('cyber_resolver_node');
            if (oldScript) oldScript.remove();

            window.procesarResolucionSheets = function(res) {
                const scriptNode = document.getElementById('cyber_resolver_node');
                if (scriptNode) scriptNode.remove();

                btnSubmit.disabled = false;
                btnSubmit.innerText = "Guardar y Resolver";

                if (res && res.status === "success") {
                    showToast(res.message);
                    cerrarModalResolver();
                    cargarGarantias(); // Actualiza la lista para quitar la resuelta
                } else {
                    showToast("Error: " + (res ? res.message : "Desconocido"), true);
                }
            };

            const scriptElement = document.createElement('script');
            scriptElement.id = 'cyber_resolver_node';
            let queryParams = `?action=resolverGarantia&filaIndex=${encodeURIComponent(fila)}&plataforma=${encodeURIComponent(plat)}&correoViejo=${encodeURIComponent(correoViejo)}&nuevoCorreo=${encodeURIComponent(nuevoCorreo)}&nuevaClave=${encodeURIComponent(nuevaClave)}&callback=procesarResolucionSheets&_ts=${Date.now()}`;
            scriptElement.src = GOOGLE_SCRIPT_URL + queryParams;
            document.body.appendChild(scriptElement);
        }

        // ==========================================
        // 6. CRONÓMETRO DE TURNO E INACTIVIDAD
        // ==========================================
        function startShiftTimer() {
            if (!sessionStorage.getItem('cyber_shift_start_time')) {
                sessionStorage.setItem('cyber_shift_start_time', Date.now());
            }
            if (!sessionStorage.getItem('cyber_shift_accumulated_time')) {
                sessionStorage.setItem('cyber_shift_accumulated_time', 0);
            }

            if (timerInterval) {
                clearInterval(timerInterval);
            }

            timerInterval = setInterval(function() {
                if (isTimerPaused) {
                    return; 
                }
                
                let startTime = parseInt(sessionStorage.getItem('cyber_shift_start_time'));
                let accumulated = parseInt(sessionStorage.getItem('cyber_shift_accumulated_time'));
                if (isNaN(accumulated)) {
                    accumulated = 0;
                }
                
                let elapsed = Date.now() - startTime;
                let totalMs = accumulated + elapsed;
                
                let totalSeconds = Math.floor(totalMs / 1000);
                let hours = Math.floor(totalSeconds / 3600);
                let minutes = Math.floor((totalSeconds % 3600) / 60);
                let seconds = totalSeconds % 60;

                let hStr = String(hours).padStart(2, '0');
                let mStr = String(minutes).padStart(2, '0');
                let sStr = String(seconds).padStart(2, '0');

                let stElement = document.getElementById('shiftTimer');
                if (stElement) {
                    stElement.innerText = hStr + ":" + mStr + ":" + sStr;
                }
            }, 1000);
        }

        function resetearInactividad() {
            if (!sessionStorage.getItem('active_staff')) return;
            if (temporizadorInactividad) clearTimeout(temporizadorInactividad);
            temporizadorInactividad = setTimeout(() => {
                if (sessionStorage.getItem('active_staff')) {
                    alert("⏳ Tu sesión se ha cerrado automáticamente tras 30 minutos de inactividad.");
                    window.location.href = 'admin.html';
                }
            }, INACTIVITY_LOGOUT_LIMIT);
        }

        function iniciarControlInactividad() {
            window.addEventListener('mousemove', resetearInactividad);
            window.addEventListener('keypress', resetearInactividad);
            window.addEventListener('click', resetearInactividad);
            window.addEventListener('scroll', resetearInactividad);
            window.addEventListener('touchstart', resetearInactividad);
            resetearInactividad(); 
        }

        // ==========================================
        // CARGA INICIAL
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            const activeUser = sessionStorage.getItem('active_staff');
            if(activeUser) {
                document.getElementById('staffSessionName').innerText = activeUser.toUpperCase();
                startShiftTimer();
                iniciarControlInactividad();
            }

            let savedTheme = localStorage.getItem('cyber_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);

            cargarGarantias(); 
        });
    </script>
</body>
</html>
